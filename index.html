<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MediVault - Secure Medical Records Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cards & Layout */
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            background: #f0f0f0;
            color: #333;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .input-group input, .input-group textarea, .input-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .record-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid #667eea;
            margin-bottom: 15px;
        }

        .record-card h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .record-image {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }

        .review-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .hospital-code {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            .logo {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        // Data storage using localStorage
        let patients = JSON.parse(localStorage.getItem('mediVault_patients')) || [];
        let hospitals = JSON.parse(localStorage.getItem('mediVault_hospitals')) || [];
        let medicalRecords = JSON.parse(localStorage.getItem('mediVault_records')) || [];
        let reviews = JSON.parse(localStorage.getItem('mediVault_reviews')) || [];

        // Helper functions
        function generate10DigitID() {
            let id = '';
            for(let i = 0; i < 10; i++) {
                id += Math.floor(Math.random() * 10);
            }
            return id;
        }

        function generateHospitalCode() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = 'H-';
            for(let i = 0; i < 6; i++) {
                if(i < 2) code += letters[Math.floor(Math.random() * 26)];
                else code += Math.floor(Math.random() * 10);
            }
            return code;
        }

        function saveAllData() {
            localStorage.setItem('mediVault_patients', JSON.stringify(patients));
            localStorage.setItem('mediVault_hospitals', JSON.stringify(hospitals));
            localStorage.setItem('mediVault_records', JSON.stringify(medicalRecords));
            localStorage.setItem('mediVault_reviews', JSON.stringify(reviews));
        }

        // Navigation state
        let currentView = 'landing'; // landing, patientLogin, hospitalLogin, patientRegister, hospitalRegister, patientDashboard, hospitalDashboard
        let currentPatient = null;
        let currentHospital = null;

        function render() {
            const app = document.getElementById('app');
            
            if(currentView === 'landing') {
                app.innerHTML = `
                    <div class="card" style="text-align: center; max-width: 500px; margin: 50px auto;">
                        <h1 class="logo" style="font-size: 48px; margin-bottom: 20px;">MediVault</h1>
                        <p style="color: #666; margin-bottom: 30px;">Your Medical Records, Secured & Accessible</p>
                        
                        <div class="grid-2" style="gap: 15px;">
                            <button class="btn btn-primary" onclick="navigateTo('patientLogin')">Patient Portal</button>
                            <button class="btn btn-primary" onclick="navigateTo('hospitalLogin')">Hospital Portal</button>
                        </div>
                    </div>
                `;
            }
            else if(currentView === 'patientLogin') {
                app.innerHTML = `
                    <div class="card" style="max-width: 500px; margin: 50px auto;">
                        <button class="btn" onclick="navigateTo('landing')" style="margin-bottom: 20px;">← Back</button>
                        <h2>Patient Portal</h2>
                        <p style="color: #666; margin-bottom: 20px;">Access your medical records</p>
                        
                        <div class="input-group">
                            <label>Patient ID (10-digit)</label>
                            <input type="text" id="patientId" maxlength="10" placeholder="Enter your 10-digit ID">
                        </div>
                        <button class="btn btn-primary" onclick="loginPatient()" style="width: 100%;">Login</button>
                        
                        <hr style="margin: 20px 0;">
                        <button class="btn" onclick="navigateTo('patientRegister')" style="width: 100%;">Register New Patient</button>
                    </div>
                `;
            }
            else if(currentView === 'patientRegister') {
                app.innerHTML = `
                    <div class="card" style="max-width: 500px; margin: 50px auto;">
                        <button class="btn" onclick="navigateTo('patientLogin')" style="margin-bottom: 20px;">← Back</button>
                        <h2>Register New Patient</h2>
                        
                        <div class="input-group">
                            <label>Full Name *</label>
                            <input type="text" id="regName" placeholder="Enter your full name">
                        </div>
                        <div class="input-group">
                            <label>Date of Birth</label>
                            <input type="date" id="regDob">
                        </div>
                        <div class="input-group">
                            <label>Contact Number</label>
                            <input type="tel" id="regPhone" placeholder="Enter contact number">
                        </div>
                        <button class="btn btn-primary" onclick="registerPatient()" style="width: 100%;">Register</button>
                    </div>
                `;
            }
            else if(currentView === 'hospitalLogin') {
                app.innerHTML = `
                    <div class="card" style="max-width: 500px; margin: 50px auto;">
                        <button class="btn" onclick="navigateTo('landing')" style="margin-bottom: 20px;">← Back</button>
                        <h2>Hospital Portal</h2>
                        <p style="color: #666; margin-bottom: 20px;">Manage patient medical records</p>
                        
                        <div class="input-group">
                            <label>Hospital Code</label>
                            <input type="text" id="hospitalCode" placeholder="e.g., H-ABC123">
                        </div>
                        <button class="btn btn-primary" onclick="loginHospital()" style="width: 100%; margin-bottom: 10px;">Login</button>
                        
                        <hr style="margin: 20px 0;">
                        <button class="btn" onclick="navigateTo('hospitalRegister')" style="width: 100%;">Register New Hospital</button>
                    </div>
                `;
            }
            else if(currentView === 'hospitalRegister') {
                app.innerHTML = `
                    <div class="card" style="max-width: 500px; margin: 50px auto;">
                        <button class="btn" onclick="navigateTo('hospitalLogin')" style="margin-bottom: 20px;">← Back</button>
                        <h2>Register New Hospital</h2>
                        
                        <div class="input-group">
                            <label>Hospital Name *</label>
                            <input type="text" id="regHospitalName" placeholder="Enter hospital name">
                        </div>
                        <div class="input-group">
                            <label>Address</label>
                            <input type="text" id="regAddress" placeholder="Enter hospital address">
                        </div>
                        <div class="input-group">
                            <label>Phone Number</label>
                            <input type="tel" id="regHospitalPhone" placeholder="Enter contact number">
                        </div>
                        <div class="input-group">
                            <label>License Number</label>
                            <input type="text" id="regLicense" placeholder="Enter medical license number">
                        </div>
                        <button class="btn btn-primary" onclick="registerHospital()" style="width: 100%;">Register Hospital</button>
                    </div>
                `;
            }
            else if(currentView === 'patientDashboard' && currentPatient) {
                const patientRecords = medicalRecords.filter(r => r.patientId === currentPatient.id);
                app.innerHTML = `
                    <div class="card">
                        <div class="header">
                            <h1 class="logo">MediVault</h1>
                            <button class="btn btn-danger" onclick="logout()">Logout</button>
                        </div>
                        
                        <div class="hospital-code" style="background: linear-gradient(135deg, #10b981, #059669);">
                            <div>Your Patient ID</div>
                            <div style="font-size: 32px;">${currentPatient.id}</div>
                            <div style="font-size: 12px; margin-top: 10px;">Share this ID with hospitals to allow them to add your medical records</div>
                        </div>
                        
                        <h3>Welcome, ${currentPatient.name}!</h3>
                        <p style="color: #666; margin-bottom: 20px;">Your Medical Records from Different Hospitals</p>
                        
                        ${patientRecords.length === 0 ? '<p style="color: #999;">No medical records found. Share your Patient ID with hospitals to add records.</p>' : ''}
                        
                        ${patientRecords.map(record => `
                            <div class="record-card">
                                <h4>🏥 ${record.hospitalName}</h4>
                                <p><strong>📅 Date:</strong> ${new Date(record.date).toLocaleDateString()}</p>
                                <p><strong>🔍 Diagnosis:</strong> ${record.diagnosis}</p>
                                <p><strong>💊 Prescription:</strong> ${record.prescription}</p>
                                <p><strong>📝 Notes:</strong> ${record.notes}</p>
                                ${record.imageData ? `<img src="${record.imageData}" class="record-image" style="max-width: 200px; margin-top: 10px;">` : ''}
                                ${record.reviews && record.reviews.length > 0 ? `
                                    <div style="margin-top: 15px; padding: 10px; background: #e0e7ff; border-radius: 10px;">
                                        <strong>👨‍⚕️ Peer Reviews:</strong>
                                        ${record.reviews.map(review => `
                                            <div style="margin-top: 8px; font-size: 13px; border-top: 1px solid #ccc; padding-top: 5px;">
                                                <strong>${review.hospitalName}:</strong> ${review.comment}
                                                <div style="color: #666;">Rating: ${'⭐'.repeat(review.rating)}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            else if(currentView === 'hospitalDashboard' && currentHospital) {
                const hospitalRecords = medicalRecords.filter(r => r.hospitalId === currentHospital.code);
                app.innerHTML = `
                    <div class="card">
                        <div class="header">
                            <h1 class="logo">MediVault</h1>
                            <button class="btn btn-danger" onclick="logout()">Logout</button>
                        </div>
                        
                        <div class="hospital-code">
                            Hospital Code: ${currentHospital.code}
                        </div>
                        
                        <h3>🏥 ${currentHospital.name}</h3>
                        
                        <div class="input-group">
                            <label>Search Patient Records (Enter 10-digit Patient ID)</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" id="searchPatientId" maxlength="10" placeholder="Enter 10-digit Patient ID" style="flex: 1;">
                                <button class="btn btn-primary" onclick="searchPatient()">Search</button>
                            </div>
                        </div>
                        
                        <div id="searchResults"></div>
                        
                        <hr style="margin: 30px 0;">
                        
                        <h4>Add New Medical Record</h4>
                        <div id="addRecordForm">
                            <div class="input-group">
                                <label>Patient ID (10-digit)</label>
                                <input type="text" id="recordPatientId" maxlength="10" placeholder="Enter patient's 10-digit ID">
                            </div>
                            <div class="input-group">
                                <label>Diagnosis</label>
                                <input type="text" id="diagnosis" placeholder="Enter diagnosis">
                            </div>
                            <div class="input-group">
                                <label>Prescription</label>
                                <textarea id="prescription" rows="3" placeholder="Enter prescription details"></textarea>
                            </div>
                            <div class="input-group">
                                <label>Additional Notes</label>
                                <textarea id="notes" rows="3" placeholder="Enter any additional notes"></textarea>
                            </div>
                            <div class="input-group">
                                <label>Upload Prescription Image (Optional)</label>
                                <input type="file" id="prescriptionImage" accept="image/*">
                            </div>
                            <button class="btn btn-primary" onclick="addMedicalRecord()">Add Record</button>
                        </div>
                        
                        <hr style="margin: 30px 0;">
                        
                        <h4>Review Records from Other Hospitals</h4>
                        <div id="reviewSection">
                            ${hospitalRecords.length === 0 ? '<p>No records added by this hospital yet.</p>' : ''}
                            ${hospitalRecords.map(record => `
                                <div class="record-card">
                                    <h4>Patient ID: ${record.patientId}</h4>
                                    <p><strong>Diagnosis:</strong> ${record.diagnosis}</p>
                                    <p><strong>Prescription:</strong> ${record.prescription}</p>
                                    <p><strong>Notes:</strong> ${record.notes}</p>
                                    <button class="btn" style="margin-top: 10px;" onclick="showReviewForm('${record.id}')">Review This Record</button>
                                    <div id="reviewForm_${record.id}" style="display: none; margin-top: 10px;">
                                        <textarea id="reviewComment_${record.id}" placeholder="Enter your review comment" rows="2"></textarea>
                                        <select id="reviewRating_${record.id}">
                                            <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                                            <option value="4">⭐⭐⭐⭐ Good</option>
                                            <option value="3">⭐⭐⭐ Average</option>
                                            <option value="2">⭐⭐ Poor</option>
                                            <option value="1">⭐ Very Poor</option>
                                        </select>
                                        <button class="btn btn-primary" onclick="submitReview('${record.id}')">Submit Review</button>
                                    </div>
                                    ${record.reviews ? record.reviews.map(review => `
                                        <div style="margin-top: 10px; padding: 10px; background: #e0e7ff; border-radius: 10px;">
                                            <strong>${review.hospitalName}:</strong> ${review.comment} (${'⭐'.repeat(review.rating)})
                                        </div>
                                    `).join('') : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // Navigation functions
        window.navigateTo = function(view) {
            currentView = view;
            render();
        };

        window.logout = function() {
            currentPatient = null;
            currentHospital = null;
            navigateTo('landing');
        };

        // Patient functions
        window.registerPatient = function() {
            const name = document.getElementById('regName')?.value;
            if(!name) {
                alert('Please enter your name');
                return;
            }
            
            const newPatient = {
                id: generate10DigitID(),
                name: name,
                dob: document.getElementById('regDob')?.value || '',
                phone: document.getElementById('regPhone')?.value || '',
                registeredAt: new Date().toISOString()
            };
            
            patients.push(newPatient);
            saveAllData();
            
            alert(`Registration Successful!\n\nYour Patient ID is: ${newPatient.id}\nPlease save this ID for future logins.`);
            navigateTo('patientLogin');
        };

        window.loginPatient = function() {
            const id = document.getElementById('patientId')?.value;
            const patient = patients.find(p => p.id === id);
            
            if(patient) {
                currentPatient = patient;
                currentView = 'patientDashboard';
                render();
            } else {
                alert('Patient ID not found. Please register first.');
            }
        };

        // Hospital functions
        window.registerHospital = function() {
            const name = document.getElementById('regHospitalName')?.value;
            if(!name) {
                alert('Please enter hospital name');
                return;
            }
            
            const newHospital = {
                code: generateHospitalCode(),
                name: name,
                address: document.getElementById('regAddress')?.value || '',
                phone: document.getElementById('regHospitalPhone')?.value || '',
                license: document.getElementById('regLicense')?.value || '',
                registeredAt: new Date().toISOString()
            };
            
            hospitals.push(newHospital);
            saveAllData();
            
            alert(`Registration Successful!\n\nYour Hospital Code is: ${newHospital.code}\nPlease save this code for future logins.`);
            navigateTo('hospitalLogin');
        };

        window.loginHospital = function() {
            const code = document.getElementById('hospitalCode')?.value;
            const hospital = hospitals.find(h => h.code === code);
            
            if(hospital) {
                currentHospital = hospital;
                currentView = 'hospitalDashboard';
                render();
            } else {
                alert('Hospital Code not found. Please register first.');
            }
        };

        // Medical record functions
        window.searchPatient = function() {
            const patientId = document.getElementById('searchPatientId')?.value;
            const patient = patients.find(p => p.id === patientId);
            const resultsDiv = document.getElementById('searchResults');
            
            if(!patient) {
                resultsDiv.innerHTML = '<div class="alert" style="background: #f8d7da; color: #721c24;">Patient not found. Please check the ID.</div>';
                return;
            }
            
            const patientRecords = medicalRecords.filter(r => r.patientId === patientId);
            
            resultsDiv.innerHTML = `
                <div class="alert">
                    <strong>Patient Found:</strong> ${patient.name}<br>
                    <strong>Total Records:</strong> ${patientRecords.length}
                </div>
                ${patientRecords.map(record => `
                    <div class="record-card">
                        <h4>🏥 Record from ${record.hospitalName}</h4>
                        <p><strong>Date:</strong> ${new Date(record.date).toLocaleDateString()}</p>
                        <p><strong>Diagnosis:</strong> ${record.diagnosis}</p>
                        <p><strong>Prescription:</strong> ${record.prescription}</p>
                        <p><strong>Notes:</strong> ${record.notes}</p>
                        ${record.imageData ? `<img src="${record.imageData}" class="record-image" style="max-width: 200px;">` : ''}
                    </div>
                `).join('')}
            `;
        };

        window.addMedicalRecord = function() {
            const patientId = document.getElementById('recordPatientId')?.value;
            const patient = patients.find(p => p.id === patientId);
            
            if(!patient) {
                alert('Patient not found. Please enter a valid 10-digit Patient ID.');
                return;
            }
            
            const diagnosis = document.getElementById('diagnosis')?.value;
            const prescription = document.getElementById('prescription')?.value;
            const notes = document.getElementById('notes')?.value;
            
            if(!diagnosis || !prescription) {
                alert('Please enter at least diagnosis and prescription');
                return;
            }
            
            let imageData = null;
            const imageFile = document.getElementById('prescriptionImage')?.files[0];
            
            const reader = new FileReader();
            reader.onload = function(e) {
                imageData = e.target.result;
                saveRecord(imageData);
            };
            
            if(imageFile) {
                reader.readAsDataURL(imageFile);
            } else {
                saveRecord(null);
            }
            
            function saveRecord(imgData) {
                const newRecord = {
                    id: Date.now().toString(),
                    patientId: patientId,
                    hospitalId: currentHospital.code,
                    hospitalName: currentHospital.name,
                    diagnosis: diagnosis,
                    prescription: prescription,
                    notes: notes,
                    imageData: imgData,
                    date: new Date().toISOString(),
                    reviews: []
                };
                
                medicalRecords.push(newRecord);
                saveAllData();
                alert('Medical record added successfully!');
                
                // Clear form
                document.getElementById('diagnosis').value = '';
                document.getElementById('prescription').value = '';
                document.getElementById('notes').value = '';
                document.getElementById('prescriptionImage').value = '';
                
                // Refresh dashboard
                render();
            }
        };

        window.showReviewForm = function(recordId) {
            const form = document.getElementById(`reviewForm_${recordId}`);
            if(form) {
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
            }
        };

        window.submitReview = function(recordId) {
            const comment = document.getElementById(`reviewComment_${recordId}`)?.value;
            const rating = parseInt(document.getElementById(`reviewRating_${recordId}`)?.value);
            
            if(!comment) {
                alert('Please enter a review comment');
                return;
            }
            
            const record = medicalRecords.find(r => r.id === recordId);
            if(record) {
                if(!record.reviews) record.reviews = [];
                record.reviews.push({
                    hospitalId: currentHospital.code,
                    hospitalName: currentHospital.name,
                    comment: comment,
                    rating: rating,
                    date: new Date().toISOString()
                });
                saveAllData();
                alert('Review submitted successfully!');
                render();
            }
        };

        // Initialize
        render();
    </script>
</body>
</html>
